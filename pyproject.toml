[project]
name = "enterprise-discord-music-bot"
version = "1.0.0"
description = "Production-grade enterprise Discord Music Bot with multi-platform streaming, real-time DSP Equalizer, and crash recovery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "wavelink>=3.5.0",
    "aiosqlite>=0.20.0",
    "Pillow>=10.3.0",
    "aiohttp>=3.9.5",
    "orjson>=3.10.0",
    "uvloop>=0.19.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
